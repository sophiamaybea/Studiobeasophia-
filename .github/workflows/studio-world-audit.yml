name: Verify Studio Bea Sophia 3D scroll world
on:
  workflow_dispatch:
  push:
    paths:
      - "somewhere-down-there/**"
      - ".github/workflows/studio-world-audit.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install browser test
        run: |
          npm install --no-save --no-audit playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check actual WebGL runtime at five scroll states
        run: node somewhere-down-there/check-world.cjs
      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-bea-sophia-scroll-evidence
          path: studio-world-audit/
          if-no-files-found: ignore
